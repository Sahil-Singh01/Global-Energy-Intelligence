name: Validate notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook validator
        run: python -m pip install --upgrade nbformat

      - name: Validate notebook structure and Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebook_paths = sorted(Path("notebooks").glob("*.ipynb"))
          if not notebook_paths:
              raise SystemExit("No notebooks found in notebooks/")

          for path in notebook_paths:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              checked = 0
              for index, cell in enumerate(notebook.cells, start=1):
                  if cell.cell_type != "code":
                      continue
                  source = cell.source
                  if source.strip():
                      compile(source, f"{path}:cell-{index}", "exec")
                      checked += 1
              print(f"PASS {path}: {checked} Python code cells checked")

          print(f"Validated {len(notebook_paths)} notebooks.")
          PY
